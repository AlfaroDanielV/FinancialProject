name: Phase 6d E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "api/routers/auth.py"
      - "api/routers/onboarding.py"
      - "api/routers/accounts.py"
      - "api/routers/recurring_incomes.py"
      - "api/routers/debts.py"
      - "api/routers/recurring_bills.py"
      - "api/services/auth/**"
      - "api/services/dispatch/**"
      - "api/services/llm_extractor/**"
      - "bot/**"
      - "tests/test_phase_6d_b11_e2e.py"
      - ".github/workflows/phase-6d-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "api/routers/auth.py"
      - "api/routers/onboarding.py"
      - "api/routers/accounts.py"
      - "api/routers/recurring_incomes.py"
      - "api/routers/debts.py"
      - "api/routers/recurring_bills.py"
      - "api/services/auth/**"
      - "api/services/dispatch/**"
      - "api/services/llm_extractor/**"
      - "bot/**"
      - "tests/test_phase_6d_b11_e2e.py"
      - ".github/workflows/phase-6d-e2e.yml"

jobs:
  phase-6d-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://finance:finance@localhost:5432/finance
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      MAGIC_LINK_SESSION_SECRET: ci-phase-6d-e2e-secret
      BCRYPT_ROUNDS: "4"
      UV_CACHE_DIR: /tmp/uv-cache
      PYTHONDONTWRITEBYTECODE: "1"
      # Required by migration 0006 to seed the initial user row.
      # CI uses throwaway values — production uses real secrets via the Azure job.
      LEGACY_USER_EMAIL: ci@example.com
      LEGACY_USER_NAME: CI User
      LEGACY_SHORTCUT_TOKEN: ci-shortcut-token-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run Phase 6d B11 E2E
        run: uv run pytest -p no:cacheprovider -q tests/test_phase_6d_b11_e2e.py
